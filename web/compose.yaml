name: nesti

services:
  app:
    build: .
    expose:
      - "8080"
    labels:
      - traefik.enable=true
      - traefik.http.services.nesti.loadbalancer.server.port=8080
      - traefik.http.routers.nesti.rule=Host(`nesti.misavoid.dev`)
      - traefik.http.routers.nesti.entrypoints=websecure
      - traefik.http.routers.nesti.tls.certresolver=myhetznerresolver
      - traefik.docker.network=${TRAEFIK_NETWORK:-virtus_default}
    networks:
      - traefik
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  sync-api:
    build:
      context: ../server
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: nesti
      DATABASE_USER: nesti_api
      DATABASE_PASSWORD_FILE: /run/secrets/db_api_password
      NESTI_SERVER_NAME: ${NESTI_SERVER_NAME:-nesti. self-hosted}
      PAIRING_PEPPER_FILE: /run/secrets/pairing_pepper
      PORT: "3000"
    expose:
      - "3000"
    secrets:
      - db_api_password
      - pairing_pepper
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.services.nesti-sync.loadbalancer.server.port=3000
      - traefik.http.routers.nesti-sync.rule=Host(`nesti.misavoid.dev`) && PathPrefix(`/api/sync/v1`)
      - traefik.http.routers.nesti-sync.priority=100
      - traefik.http.routers.nesti-sync.entrypoints=websecure
      - traefik.http.routers.nesti-sync.tls.certresolver=myhetznerresolver
      - traefik.http.routers.nesti-sync.middlewares=nesti-sync-limit
      - traefik.http.middlewares.nesti-sync-limit.ratelimit.average=60
      - traefik.http.middlewares.nesti-sync-limit.ratelimit.burst=120
      - traefik.docker.network=${TRAEFIK_NETWORK:-virtus_default}
    networks:
      - traefik
      - sync-data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  migrate:
    build:
      context: ../server
    command: ["node", "dist/migrate.js"]
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: nesti
      DATABASE_USER: nesti_owner
      DATABASE_PASSWORD_FILE: /run/secrets/db_owner_password
      DATABASE_RUNTIME_PASSWORD_FILE: /run/secrets/db_api_password
    secrets:
      - db_owner_password
      - db_api_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sync-data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nesti
      POSTGRES_USER: nesti_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner_password
    secrets:
      - db_owner_password
    volumes:
      - nesti-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nesti_owner -d nesti"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sync-data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:-virtus_default}
    external: true
  sync-data:
    internal: true

volumes:
  nesti-db:

secrets:
  db_owner_password:
    file: /opt/nesti/secrets/db_owner_password

  db_api_password:
    file: /opt/nesti/secrets/db_api_password

  pairing_pepper:
    file: /opt/nesti/secrets/pairing_pepper
